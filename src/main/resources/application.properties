# ==============================================================================
# ONLINE FOOD DELIVERY SYSTEM - SPRING BOOT CONFIGURATION
# ==============================================================================
spring.application.name=online-food-delivery-system

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Active Profile Options:
#   - dev       : In-memory H2 (Fast zero-setup testing, default)
#   - sqlserver : Microsoft SQL Server / SSMS (Database: food_delivery_db)
spring.profiles.active=dev

# ------------------------------------------------------------------------------
# 1. Dev Profile Datasource (In-Memory H2 in PostgreSQL Mode)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:food_delivery_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ------------------------------------------------------------------------------
# 2. Microsoft SQL Server & SSMS Datasource (Switch via spring.profiles.active=sqlserver)
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=food_delivery_db;encrypt=true;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=Password123!
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# HikariCP Connection Pool Optimization
spring.datasource.hikari.pool-name=FoodDeliveryHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate Settings
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# SQL Script Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/schema.sql
spring.sql.init.data-locations=classpath:db/migration/data.sql
spring.sql.init.continue-on-error=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration
logging.level.root=INFO
logging.level.com.fooddelivery=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=INFO

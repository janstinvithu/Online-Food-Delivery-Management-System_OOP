# ==============================================================================
# ONLINE FOOD DELIVERY SYSTEM - JSON FILE STORAGE
# ==============================================================================
spring.application.name=online-food-delivery-system

server.port=8080
server.servlet.context-path=/

# JSON data lives outside the web root. ./data is created on startup when missing.
app.storage.data-directory=./data
app.storage.file-name=food-delivery-data.json

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=INFO
logging.level.com.fooddelivery=DEBUG

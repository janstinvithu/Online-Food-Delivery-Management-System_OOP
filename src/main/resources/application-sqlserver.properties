# ==============================================================================
# ONLINE FOOD DELIVERY SYSTEM - MICROSOFT SQL SERVER & SSMS PROFILE
# Active when: spring.profiles.active=sqlserver
# ==============================================================================
spring.application.name=online-food-delivery-system

# Server Configuration
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# Microsoft SQL Server Datasource Configuration (Local / SQLEXPRESS)
# ------------------------------------------------------------------------------
# Option 1: SQL Server Authentication (Default: sa / Password123!)
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=food_delivery_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Password123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Option 2 (Alternative if using standard TCP port 1433):
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=food_delivery_db;encrypt=true;trustServerCertificate=true

# Option 3 (Windows Integrated Authentication):
# spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=food_delivery_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=FoodDeliveryMssqlPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings for SQL Server
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.root=INFO
logging.level.com.fooddelivery=DEBUG
logging.level.org.hibernate.SQL=DEBUG

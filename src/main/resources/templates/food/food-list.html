<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu Directory | Online Food Delivery System</title>
    <!-- Early Theme Initializer to Prevent FOUC -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>

<div th:replace="~{layout/header :: header('foods')}"></div>

<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;">Food Menu Directory</h1>

        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
            <!-- Live Keystroke Search -->
            <div class="table-search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" class="form-control live-table-search" placeholder="Live filter menu..." 
                       data-table-target="#foodMenuTable">
            </div>
            <a th:href="@{/foods/new}" class="btn btn-primary">+ Add Food Item</a>
        </div>
    </div>

    <!-- Filter Chips for Food Menu -->
    <div class="filter-chips" data-table-target="#foodMenuTable">
        <button type="button" class="filter-chip active" data-filter="all">All Items</button>
        <button type="button" class="filter-chip" data-filter="main course">🍛 Main Courses</button>
        <button type="button" class="filter-chip" data-filter="beverage">🥤 Beverages</button>
        <button type="button" class="filter-chip" data-filter="in stock">🟢 In Stock</button>
        <button type="button" class="filter-chip" data-filter="sold out">🔴 Sold Out</button>
    </div>

    <div class="card-container">
        <div class="table-responsive">
            <table class="custom-table" id="foodMenuTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Dish / Beverage Name</th>
                    <th>Subclass Category</th>
                    <th>Price (LKR)</th>
                    <th>Prep Time</th>
                    <th>Stock Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${foodItems}">
                    <td class="td-strong" th:text="${item.id}">1</td>
                    <td>
                        <div class="td-strong" th:text="${item.name}">Chicken Dum Biryani Special</div>
                        <small style="color: var(--text-muted);" th:text="${item.description}">Description</small>
                    </td>
                    <td>
                        <span class="status-pill status-READY" th:text="${item.foodCategory}">Main Course</span>
                    </td>
                    <td class="td-strong" style="color: var(--primary);" 
                        th:text="${@currency.format(item.price)}">LKR 1,850.00</td>
                    <td th:text="${item.preparationTimeMinutes} + ' mins'">25 mins</td>
                    <td>
                        <span th:if="${item.available}" class="status-pill status-DELIVERED">In Stock</span>
                        <span th:unless="${item.available}" class="status-pill status-CANCELLED">Sold Out</span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <a th:href="@{'/foods/edit/' + ${item.id}}" class="btn btn-secondary btn-sm">Edit</a>
                            <form th:action="@{'/foods/delete/' + ${item.id}}" method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this food item?');">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>

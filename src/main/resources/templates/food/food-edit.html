<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Food Item | Online Food Delivery System</title>
    <!-- Early Theme Initializer to Prevent FOUC -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>

<div th:replace="~{layout/header :: header('foods')}"></div>

<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;">Update Food Item</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;" 
               th:text="'Modifying ' + ${foodItem.name} + ' (' + ${foodItem.foodCategory} + ')'">
                Modifying item
            </p>
        </div>
        <a th:href="@{/foods}" class="btn btn-secondary">&larr; Back to Catalog</a>
    </div>

    <!-- Error Banner -->
    <div th:if="${errorMessage != null}" class="alert-error">
        <span>⚠️</span>
        <span th:text="${errorMessage}">Validation error occurred.</span>
    </div>

    <div class="card-container fade-in">
        <form th:action="@{'/foods/edit/' + ${foodItem.id}}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="editName">Food Item Name *</label>
                    <input type="text" id="editName" name="name" th:value="${foodItem.name}" 
                           class="form-control" required minlength="2" maxlength="100" 
                           placeholder="e.g. Chicken Dum Biryani Special">
                </div>
                <div class="form-group">
                    <label class="form-label" for="editPrice">Price (LKR) *</label>
                    <input type="number" id="editPrice" step="0.01" min="0.01" name="price" 
                           th:value="${foodItem.price}" class="form-control" required 
                           placeholder="1850.00">
                </div>
                <div class="form-group">
                    <label class="form-label" for="editPrepTime">Prep Time (Mins) *</label>
                    <input type="number" id="editPrepTime" min="1" max="180" name="preparationTimeMinutes" 
                           th:value="${foodItem.preparationTimeMinutes}" class="form-control" required 
                           placeholder="25">
                </div>
                <div class="form-group full-width">
                    <label class="form-label" for="editDesc">Description</label>
                    <textarea id="editDesc" name="description" class="form-control" rows="3" 
                              maxlength="255" th:text="${foodItem.description}"
                              placeholder="Recipe and ingredient details..."></textarea>
                </div>

                <!-- Subclass Specific: MainCourse -->
                <th:block th:if="${foodItem instanceof T(com.fooddelivery.model.food.MainCourse)}">
                    <div class="form-group">
                        <label class="form-label" for="editCuisine">Cuisine Type *</label>
                        <input type="text" id="editCuisine" name="cuisineType" th:value="${foodItem.cuisineType}"
                               class="form-control" required minlength="2" maxlength="50" placeholder="e.g. Sri Lankan Dum">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editSpice">Spice Level *</label>
                        <select id="editSpice" name="spiceLevel" class="form-control" required>
                            <option value="MILD" th:selected="${foodItem.spiceLevel == 'MILD'}">MILD</option>
                            <option value="MEDIUM" th:selected="${foodItem.spiceLevel == 'MEDIUM'}">MEDIUM</option>
                            <option value="HOT" th:selected="${foodItem.spiceLevel == 'HOT'}">HOT</option>
                            <option value="EXTRA_HOT" th:selected="${foodItem.spiceLevel == 'EXTRA_HOT'}">EXTRA HOT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPortion">Serving Portion *</label>
                        <input type="text" id="editPortion" name="servingPortion" th:value="${foodItem.servingPortion}"
                               class="form-control" required minlength="2" maxlength="100" placeholder="e.g. Full Clay Pot">
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox" style="margin-top: 1.8rem;">
                            <input type="checkbox" name="vegetarian" value="true" th:checked="${foodItem.vegetarian}">
                            <span class="form-label" style="margin-bottom: 0;">🌱 Vegetarian Dish</span>
                        </label>
                    </div>
                </th:block>

                <!-- Subclass Specific: Beverage -->
                <th:block th:if="${foodItem instanceof T(com.fooddelivery.model.food.Beverage)}">
                    <div class="form-group">
                        <label class="form-label" for="editVolSize">Volume Size Label *</label>
                        <input type="text" id="editVolSize" name="volumeSize" th:value="${foodItem.volumeSize}"
                               class="form-control" required minlength="2" maxlength="30" placeholder="e.g. Regular (350ml)">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editVolMl">Volume (ml) *</label>
                        <input type="number" id="editVolMl" name="volumeMl" th:value="${foodItem.volumeMl}"
                               class="form-control" required min="1" max="5000" placeholder="350">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editSugar">Sugar Level *</label>
                        <select id="editSugar" name="sugarLevel" class="form-control" required>
                            <option value="ZERO" th:selected="${foodItem.sugarLevel == 'ZERO'}">ZERO SUGAR</option>
                            <option value="LOW" th:selected="${foodItem.sugarLevel == 'LOW'}">LOW</option>
                            <option value="MEDIUM" th:selected="${foodItem.sugarLevel == 'MEDIUM'}">MEDIUM</option>
                            <option value="HIGH" th:selected="${foodItem.sugarLevel == 'HIGH'}">HIGH</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editCaffeine">Caffeine Content (mg)</label>
                        <input type="number" id="editCaffeine" name="caffeineContentMg" th:value="${foodItem.caffeineContentMg}"
                               class="form-control" min="0" max="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox" style="margin-top: 1.8rem;">
                            <input type="checkbox" name="cold" value="true" th:checked="${foodItem.cold}">
                            <span class="form-label" style="margin-bottom: 0;">🧊 Served Cold / Chilled</span>
                        </label>
                    </div>
                </th:block>

                <div class="form-group">
                    <label class="form-checkbox">
                        <input type="checkbox" name="available" th:checked="${foodItem.available}">
                        <span class="form-label" style="margin-bottom: 0;">🟢 Available / In Stock</span>
                    </label>
                </div>
            </div>
            <div class="form-footer">
                <a th:href="@{/foods}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes &rarr;</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>

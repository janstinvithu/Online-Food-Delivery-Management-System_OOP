<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>

<nav th:fragment="navbar(activeTab)" class="navbar">
    <div style="display: flex; align-items: center; gap: 1.75rem; flex-wrap: wrap;">
        <a th:href="${session.userRole == 'CUSTOMER' ? '/orders/my-orders' : '/'}" class="brand">
            <div class="brand-icon">
                <img th:src="@{/images/logo.svg}" alt="FoodFlow LK Logo" width="24" height="24">
            </div>
            <div class="brand-title">Food<span>Flow</span> LK</div>
        </a>

        <!-- Sri Lanka Locale Pill -->
        <div class="locale-badge" title="Sri Lankan Rupee Locale">
            <span>🇱🇰</span>
            <span>LKR</span>
        </div>

        <!-- Dynamic Navigation Links depending on User Role -->
        <ul class="nav-links">
            <!-- 1. Admin Role Links -->
            <th:block th:if="${session.userRole == 'ADMIN'}">
                <li>
                    <a th:href="@{/}" th:class="${activeTab == 'dashboard' ? 'nav-link active' : 'nav-link'}">
                        <span>📊</span> Dashboard
                    </a>
                </li>
                <li>
                    <a th:href="@{/foods}" th:class="${activeTab == 'foods' ? 'nav-link active' : 'nav-link'}">
                        <span>🍛</span> Food Menu
                    </a>
                </li>
                <li>
                    <a th:href="@{/customers}" th:class="${activeTab == 'customers' ? 'nav-link active' : 'nav-link'}">
                        <span>👥</span> Customers
                    </a>
                </li>
                <li>
                    <a th:href="@{/orders}" th:class="${activeTab == 'orders' ? 'nav-link active' : 'nav-link'}">
                        <span>📋</span> Orders Audit
                    </a>
                </li>
                <li>
                    <a th:href="@{/deliveries}" th:class="${activeTab == 'deliveries' ? 'nav-link active' : 'nav-link'}">
                        <span>🛵</span> Dispatch &amp; Riders
                    </a>
                </li>
            </th:block>

            <!-- 2. Customer Role Links -->
            <th:block th:if="${session.userRole == 'CUSTOMER'}">
                <li>
                    <a th:href="@{/orders/my-orders}" th:class="${activeTab == 'my-orders' ? 'nav-link active' : 'nav-link'}">
                        <span>📦</span> My Orders
                    </a>
                </li>
                <li>
                    <a th:href="@{/orders/new}" th:class="${activeTab == 'orders' or activeTab == 'order-new' ? 'nav-link active' : 'nav-link'}">
                        <span>🛒</span> Order Food
                    </a>
                </li>
                <li>
                    <a th:href="@{/orders/addresses}" th:class="${activeTab == 'addresses' ? 'nav-link active' : 'nav-link'}">
                        <span>📍</span> Addresses
                    </a>
                </li>
                <li>
                    <a th:href="@{/customers/profile}" th:class="${activeTab == 'profile' ? 'nav-link active' : 'nav-link'}">
                        <span>⭐</span> My Profile &amp; Tier
                    </a>
                </li>
            </th:block>
        </ul>
    </div>

    <!-- Right-aligned Actions & Auth Section -->
    <div style="display: flex; align-items: center; gap: 0.85rem;">
        <!-- Theme Toggle Button -->
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <!-- Authenticated: Admin User -->
        <div th:if="${session.userRole == 'ADMIN'}" style="display: flex; align-items: center; gap: 0.85rem;">
            <div style="text-align: right; line-height: 1.25;">
                <div style="font-weight: 700; font-size: 0.9rem; color: var(--text-primary);" th:text="${session.userName}">System Administrator</div>
                <div style="display: flex; align-items: center; gap: 0.35rem; justify-content: flex-end; margin-top: 0.2rem;">
                    <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #10B981; animation: pulseDotSuccess 2s infinite;"></span>
                    <span style="font-size: 0.72rem; font-weight: 700; color: #10B981; letter-spacing: 0.05em; text-transform: uppercase;">ADMIN PORTAL</span>
                </div>
            </div>
            <a th:href="@{/logout}" class="btn btn-secondary btn-sm">Sign Out</a>
        </div>

        <!-- Authenticated: Customer User -->
        <div th:if="${session.userRole == 'CUSTOMER'}" style="display: flex; align-items: center; gap: 0.85rem;">
            <div style="text-align: right; line-height: 1.25;">
                <div style="font-weight: 700; font-size: 0.9rem; color: var(--text-primary);" th:text="${session.userName}">Customer</div>
                <div style="margin-top: 0.2rem;">
                    <span th:if="${session.currentUser != null and session.currentUser.registeredCustomer}" 
                          class="tier-badge"
                          th:classappend="'tier-' + ${session.currentUser.membershipTier}"
                          th:text="${session.currentUser.membershipTier} + ' MEMBER'">PLATINUM MEMBER</span>
                    <span th:unless="${session.currentUser != null and session.currentUser.registeredCustomer}"
                          class="tier-badge tier-GUEST">GUEST</span>
                </div>
            </div>
            <a th:href="@{/logout}" class="btn btn-secondary btn-sm">Sign Out</a>
        </div>

        <!-- Unauthenticated Public Visitor -->
        <div th:if="${session.userRole == null}" style="display: flex; align-items: center; gap: 0.65rem;">
            <a th:href="@{/login}" class="btn btn-primary btn-sm">Log In</a>
            <a th:href="@{/customers/new}" class="btn btn-secondary btn-sm">Register</a>
        </div>
    </div>
</nav>

</body>
</html>

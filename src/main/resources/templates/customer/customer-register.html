<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer | Online Food Delivery System</title>
    <!-- Early Theme Initializer to Prevent FOUC -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>

<div th:replace="~{layout/header :: header('customers')}"></div>

<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;">Register Customer</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">
                Select account type: Registered Member (with loyalty points &amp; discounts) or Guest Profile.
            </p>
        </div>
        <a th:href="@{/customers}" class="btn btn-secondary">&larr; Back to Customers</a>
    </div>

    <!-- Error Alert Banner -->
    <div th:if="${errorMessage != null}" class="alert-error">
        <span>⚠️</span>
        <span th:text="${errorMessage}">Validation error occurred. Please correct the fields.</span>
    </div>

    <!-- Subclass Selector Tabs -->
    <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <button type="button" class="btn" 
                th:classappend="${activeTab == 'guest' ? 'btn-secondary' : 'btn-primary active'}" 
                data-tab-target="#registeredPanel">⭐ Registered Member Account</button>
        <button type="button" class="btn" 
                th:classappend="${activeTab == 'guest' ? 'btn-primary active' : 'btn-secondary'}" 
                data-tab-target="#guestPanel">👤 Guest Customer Profile</button>
    </div>

    <!-- Panel 1: Registered Customer -->
    <div id="registeredPanel" class="tab-panel card-container fade-in" 
         th:style="${activeTab == 'guest' ? 'display: none;' : 'display: block;'}">
        <form th:action="@{/customers/new/account}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name *</label>
                    <input type="text" id="regName" name="fullName" class="form-control" 
                           th:value="${regFullName}" required minlength="2" maxlength="100" 
                           placeholder="e.g. Eleanor Fernando">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address *</label>
                    <input type="email" id="regEmail" name="email" class="form-control" 
                           th:value="${regEmail}" required maxlength="120" 
                           placeholder="eleanor.fernando@vanguard.lk">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPhone">Contact Phone Number *</label>
                    <input type="tel" id="regPhone" name="phone" class="form-control" 
                           th:value="${regPhone}" required pattern="^\+?[0-9\s\-]{8,20}$" 
                           title="Enter a valid phone number (e.g. +94-77-1234567)"
                           placeholder="+94-77-1234567">
                </div>
                <div class="form-group full-width">
                    <label class="form-label" for="regAddress">Default Delivery Address (Sri Lanka) *</label>
                    <input type="text" id="regAddress" name="address" class="form-control" 
                           th:value="${regAddress}" required minlength="5" maxlength="255" 
                           placeholder="e.g. No. 42, Ward Place, Colombo 07">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPoints">Initial Loyalty Points</label>
                    <input type="number" id="regPoints" name="loyaltyPoints" class="form-control" 
                           min="0" max="100000" th:value="${regLoyaltyPoints != null ? regLoyaltyPoints : 0}">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regTier">Membership Tier</label>
                    <select id="regTier" name="membershipTier" class="form-control">
                        <option value="BRONZE" th:selected="${regMembershipTier == 'BRONZE'}">BRONZE (0% Discount)</option>
                        <option value="SILVER" th:selected="${regMembershipTier == 'SILVER'}">SILVER (5% Discount - 200+ pts)</option>
                        <option value="GOLD" th:selected="${regMembershipTier == 'GOLD'}">GOLD (10% Discount - 500+ pts)</option>
                        <option value="PLATINUM" th:selected="${regMembershipTier == 'PLATINUM'}">PLATINUM (15% Discount - 1000+ pts)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPayment">Preferred Payment Method</label>
                    <select id="regPayment" name="preferredPaymentMethod" class="form-control">
                        <option value="CARD" th:selected="${regPreferredPaymentMethod == 'CARD'}">Credit / Debit Card</option>
                        <option value="CASH" th:selected="${regPreferredPaymentMethod == 'CASH'}">Cash on Delivery / Counter</option>
                    </select>
                </div>
            </div>
            <div class="form-footer">
                <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Registered Account &rarr;</button>
            </div>
        </form>
    </div>

    <!-- Panel 2: Guest Customer -->
    <div id="guestPanel" class="tab-panel card-container fade-in" 
         th:style="${activeTab == 'guest' ? 'display: block;' : 'display: none;'}">
        <form th:action="@{/customers/new/guest}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="guestName">Guest Full Name *</label>
                    <input type="text" id="guestName" name="fullName" class="form-control" 
                           th:value="${guestFullName}" required minlength="2" maxlength="100" 
                           placeholder="e.g. Sophia De Silva">
                </div>
                <div class="form-group">
                    <label class="form-label" for="guestEmail">Email Address *</label>
                    <input type="email" id="guestEmail" name="email" class="form-control" 
                           th:value="${guestEmail}" required maxlength="120" 
                           placeholder="sophia.desilva@gmail.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="guestPhone">Contact Phone *</label>
                    <input type="tel" id="guestPhone" name="phone" class="form-control" 
                           th:value="${guestPhone}" required pattern="^\+?[0-9\s\-]{8,20}$" 
                           title="Enter a valid phone number (e.g. +94-76-5551234)"
                           placeholder="+94-76-5551234">
                </div>
                <div class="form-group full-width">
                    <label class="form-label" for="guestAddress">Delivery Address (Sri Lanka)</label>
                    <input type="text" id="guestAddress" name="address" class="form-control" 
                           th:value="${guestAddress}" maxlength="255" 
                           placeholder="e.g. No. 10, Church Street, Galle Fort">
                </div>
            </div>
            <div class="form-footer">
                <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Guest Profile &rarr;</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>

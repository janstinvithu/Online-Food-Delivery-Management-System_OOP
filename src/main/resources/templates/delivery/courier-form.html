<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier | Online Food Delivery System</title>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>
<div th:replace="~{layout/header :: header('deliveries')}"></div>
<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;"
                th:text="${courier == null} ? 'Add courier' : 'Update courier'">Add courier</h1>
        </div>
        <a th:href="@{/deliveries/couriers}" class="btn btn-secondary">&larr; Courier fleet</a>
    </div>
    <div th:if="${successMessage != null}" class="alert-success" style="margin-bottom: 1.5rem;">
        <span>✓</span><span th:text="${successMessage}">Saved.</span>
    </div>
    <div th:if="${errorMessage != null}" class="alert-error" style="margin-bottom: 1.5rem;">
        <span>⚠️</span>
        <span th:text="${errorMessage}">Check the courier details.</span>
    </div>
    <form class="card-container" style="padding: 1.75rem;" method="post"
          th:action="${courier == null} ? @{/deliveries/couriers/new} : @{'/deliveries/couriers/edit/' + ${courier.id}}">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="name">Name</label>
                <input id="name" name="name" class="form-control" required maxlength="80"
                       th:value="${courier != null} ? ${courier.name} : ''">
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">Phone</label>
                <input id="phone" name="phone" class="form-control" required maxlength="20"
                       th:value="${courier != null} ? ${courier.phone} : ''" placeholder="+94-77-0000000">
            </div>
            <div class="form-group">
                <label class="form-label" for="vehicleType">Vehicle type</label>
                <input id="vehicleType" name="vehicleType" class="form-control" required maxlength="40"
                       th:value="${courier != null} ? ${courier.vehicleType} : ''" placeholder="Motorcycle">
            </div>
            <div class="form-group">
                <label class="form-label" for="vehiclePlateNumber">Plate number</label>
                <input id="vehiclePlateNumber" name="vehiclePlateNumber" class="form-control" required maxlength="20"
                       th:value="${courier != null} ? ${courier.vehiclePlateNumber} : ''" placeholder="WP CA-1234">
            </div>
            <div class="form-group">
                <label class="form-label" for="rating">Rating (1.00 to 5.00)</label>
                <input id="rating" name="rating" type="number" step="0.01" min="1" max="5" class="form-control" required
                       th:value="${courier != null} ? ${courier.rating} : '5.00'">
            </div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="${courier == null} ? 'Create courier' : 'Update courier'">Create courier</button>
    </form>

    <div th:if="${courier != null}" style="margin-top: 1.5rem;">
        <form class="card-container" style="padding: 1.75rem; margin-bottom: 1rem;" method="post"
              th:action="@{'/deliveries/couriers/' + ${courier.id} + '/shifts'}">
            <h2 class="section-title" style="font-size: 1.2rem;">Add shift</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="shiftDate">Date</label>
                    <input id="shiftDate" name="shiftDate" type="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="startTime">Start</label>
                    <input id="startTime" name="startTime" type="time" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="endTime">End</label>
                    <input id="endTime" name="endTime" type="time" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Add shift</button>
        </form>
        <div class="card-container" th:each="shift : ${shifts}" style="padding: 1.25rem; margin-bottom: 1rem;">
            <form method="post" th:action="@{'/deliveries/couriers/' + ${courier.id} + '/shifts'}">
                <input type="hidden" name="shiftId" th:value="${shift.id}">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input name="shiftDate" type="date" class="form-control" required
                               th:value="${#temporals.format(shift.shiftDate, 'yyyy-MM-dd')}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Start</label>
                        <input name="startTime" type="time" class="form-control" required
                               th:value="${#temporals.format(shift.startTime, 'HH:mm')}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">End</label>
                        <input name="endTime" type="time" class="form-control" required
                               th:value="${#temporals.format(shift.endTime, 'HH:mm')}">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Update shift</button>
            </form>
            <form method="post" style="margin-top: 0.75rem;"
                  th:action="@{'/deliveries/couriers/' + ${courier.id} + '/shifts/' + ${shift.id} + '/delete'}"
                  onsubmit="return confirm('Remove this shift?');">
                <button type="submit" class="btn btn-danger btn-sm">Delete shift</button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Fleet | Online Food Delivery System</title>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>
<div th:replace="~{layout/header :: header('deliveries')}"></div>
<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;">Courier fleet</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Add, view, update, or remove a delivery courier.</p>
        </div>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a th:href="@{/deliveries}" class="btn btn-secondary">&larr; Dispatch board</a>
            <a th:href="@{/deliveries/couriers/new}" class="btn btn-primary">+ Add courier</a>
        </div>
    </div>

    <div th:if="${successMessage != null}" class="alert-success" style="margin-bottom: 1.5rem;">
        <span>✓</span>
        <span th:text="${successMessage}">Courier saved.</span>
    </div>
    <div th:if="${errorMessage != null}" class="alert-error" style="margin-bottom: 1.5rem;">
        <span>⚠️</span>
        <span th:text="${errorMessage}">Courier could not be changed.</span>
    </div>

    <div th:if="${#lists.isEmpty(couriers)}" class="card-container" style="text-align: center; padding: 3rem;">
        <h3>No couriers yet</h3>
        <a th:href="@{/deliveries/couriers/new}" class="btn btn-primary">Add the first courier</a>
    </div>

    <div class="card-container" th:unless="${#lists.isEmpty(couriers)}">
        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Vehicle</th>
                    <th>Rating</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="courier : ${couriers}">
                    <td class="td-strong" th:text="${courier.name}">Kasun</td>
                    <td th:text="${courier.phone}">+94</td>
                    <td th:text="${courier.vehicleDetails}">Bike</td>
                    <td th:text="${courier.rating}">5.00</td>
                    <td>
                        <span th:if="${courier.available}" class="status-pill status-DELIVERED">Available</span>
                        <span th:unless="${courier.available}" class="status-pill status-OUT_FOR_DELIVERY">On route</span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <a class="btn btn-secondary btn-sm" th:href="@{'/deliveries/couriers/edit/' + ${courier.id}}">Edit</a>
                            <form th:action="@{'/deliveries/couriers/delete/' + ${courier.id}}" method="post"
                                  onsubmit="return confirm('Remove this courier from the fleet?');">
                                <button type="submit" class="btn btn-danger btn-sm" th:disabled="${!courier.available}">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

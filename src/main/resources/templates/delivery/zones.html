<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Zones | Online Food Delivery System</title>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>
<div th:replace="~{layout/header :: header('deliveries')}"></div>
<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;"
                th:text="${zone == null} ? 'Delivery zones' : 'Update delivery zone'">Delivery zones</h1>
            <p style="color: var(--text-secondary);">Each area has its own delivery fee. A zone used by an order stays in the list.</p>
        </div>
        <a th:href="@{/deliveries}" class="btn btn-secondary">&larr; Dispatch board</a>
    </div>
    <div th:if="${successMessage != null}" class="alert-success" style="margin-bottom: 1.5rem;">
        <span>✓</span><span th:text="${successMessage}">Saved.</span>
    </div>
    <div th:if="${errorMessage != null}" class="alert-error" style="margin-bottom: 1.5rem;">
        <span>⚠️</span><span th:text="${errorMessage}">Check the zone.</span>
    </div>
    <form class="card-container" style="padding: 1.75rem; margin-bottom: 1.5rem;" method="post" th:action="@{/deliveries/zones}">
        <input type="hidden" name="id" th:if="${zone != null}" th:value="${zone.id}">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="areaName">Area</label>
                <input id="areaName" name="areaName" class="form-control" required maxlength="80"
                       th:value="${zone != null} ? ${zone.areaName} : ''" placeholder="Colombo 07">
            </div>
            <div class="form-group">
                <label class="form-label" for="fee">Delivery fee (LKR)</label>
                <input id="fee" name="fee" type="number" min="0" step="0.01" class="form-control" required
                       th:value="${zone != null} ? ${zone.fee} : '350.00'">
            </div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="${zone == null} ? 'Add zone' : 'Update zone'">Add zone</button>
    </form>
    <div class="card-container" th:unless="${#lists.isEmpty(zones)}">
        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                <tr><th>Area</th><th>Fee</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${zones}">
                    <td class="td-strong" th:text="${item.areaName}">Colombo 07</td>
                    <td th:text="${@currency.format(item.fee)}">LKR 350.00</td>
                    <td>
                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <a class="btn btn-secondary btn-sm" th:href="@{/deliveries/zones(edit=${item.id})}">Edit</a>
                            <form th:action="@{'/deliveries/zones/' + ${item.id} + '/delete'}" method="post"
                                  onsubmit="return confirm('Remove this delivery zone?');">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

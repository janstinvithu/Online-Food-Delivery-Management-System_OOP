<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Checkpoints | Online Food Delivery System</title>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('foodflow_theme');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>
<div th:replace="~{layout/header :: header('deliveries')}"></div>
<main class="container">
    <div class="section-header">
        <div>
            <h1 class="hero-title" style="font-size: 1.85rem; margin-bottom: 0.25rem;">
                Checkpoints · <span th:text="${delivery.trackingNumber}">TRK</span>
            </h1>
            <p style="color: var(--text-secondary);">Record picked up, on the way, or nearby. Correct a step or remove a mistaken entry.</p>
        </div>
        <a th:href="@{/deliveries}" class="btn btn-secondary">&larr; Dispatch board</a>
    </div>
    <div th:if="${successMessage != null}" class="alert-success" style="margin-bottom: 1.5rem;">
        <span>✓</span><span th:text="${successMessage}">Saved.</span>
    </div>
    <div th:if="${errorMessage != null}" class="alert-error" style="margin-bottom: 1.5rem;">
        <span>⚠️</span><span th:text="${errorMessage}">Check the checkpoint.</span>
    </div>
    <form class="card-container" style="padding: 1.75rem; margin-bottom: 1.5rem;" method="post"
          th:action="@{'/deliveries/' + ${delivery.id} + '/checkpoints'}">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="step">Step</label>
                <select id="step" name="step" class="form-control" required>
                    <option value="PICKED_UP">PICKED_UP</option>
                    <option value="ON_THE_WAY">ON_THE_WAY</option>
                    <option value="NEARBY">NEARBY</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="note">Note</label>
                <input id="note" name="note" class="form-control" maxlength="255" placeholder="Left the kitchen">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Add checkpoint</button>
    </form>
    <div class="card-container" th:each="checkpoint : ${checkpoints}" style="padding: 1.25rem; margin-bottom: 1rem;">
        <form method="post" th:action="@{'/deliveries/' + ${delivery.id} + '/checkpoints'}">
            <input type="hidden" name="checkpointId" th:value="${checkpoint.id}">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Step</label>
                    <select name="step" class="form-control">
                        <option value="PICKED_UP" th:selected="${checkpoint.step == 'PICKED_UP'}">PICKED_UP</option>
                        <option value="ON_THE_WAY" th:selected="${checkpoint.step == 'ON_THE_WAY'}">ON_THE_WAY</option>
                        <option value="NEARBY" th:selected="${checkpoint.step == 'NEARBY'}">NEARBY</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Time</label>
                    <input name="recordedAt" type="datetime-local" class="form-control" required
                           th:value="${#temporals.format(checkpoint.recordedAt, 'yyyy-MM-dd''T''HH:mm')}">
                </div>
                <div class="form-group">
                    <label class="form-label">Note</label>
                    <input name="note" class="form-control" maxlength="255" th:value="${checkpoint.note}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Update checkpoint</button>
        </form>
        <form method="post" style="margin-top: 0.75rem;"
              th:action="@{'/deliveries/' + ${delivery.id} + '/checkpoints/' + ${checkpoint.id} + '/delete'}"
              onsubmit="return confirm('Remove this checkpoint?');">
            <button type="submit" class="btn btn-danger btn-sm">Delete checkpoint</button>
        </form>
    </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
